<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haus 3D – Testseite</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { --primary-background-color: #fafafa; --card-background-color: #fff; --primary-text-color: #212121;
         --secondary-text-color: #727272; --app-header-background-color: #03a9f4; --primary-color: #03a9f4; }
  body.dark { --primary-background-color: #111; --card-background-color: #1c1c1c; --primary-text-color: #e1e1e1;
         --secondary-text-color: #9b9b9b; --app-header-background-color: #101e24; }
  haus3d-panel { display: block; height: 100vh; }
</style>
</head>
<body>
<script type="module">
// Testseite ohne Home Assistant: nachgebautes hass-Objekt mit Bereichen, Geräten und Zuständen.
const params = new URLSearchParams(location.search);
const dark = params.has("dark");
if (dark) document.body.classList.add("dark");
// ha-icon gibt es nur in HA: Platzhalter, der den Iconnamen kurz anzeigt
customElements.define("ha-icon", class extends HTMLElement {
  static observedAttributes = ["icon"];
  attributeChangedCallback() { this.textContent = (this.getAttribute("icon") || "").replace("mdi:", "").slice(0, 2); this.style.fontSize = "11px"; }
});
const data = await (await fetch("../../custom_components/haus3d/haus-daten.json")).json();
// Testfälle für Türen: zweiflügelig und Schiebetür, beide offen
const eg = data.floors.find((f) => f.id === "eg");
for (const o of eg.openings) {
  if (o.id === "wz_fenster_west") Object.assign(o, { type: "door", sill: 0, height: 2.1, leaves: 2, style: "glass", contact: "binary_sensor.terrasse_doppel" });
  if (o.id === "sz_fenster") Object.assign(o, { type: "door", sill: 0, height: 2.1, style: "sliding", contact: "binary_sensor.schiebetuer" });
}
const st = (entity_id, state, attributes = {}) => ({ entity_id, state, attributes: { friendly_name: entity_id, ...attributes }, last_updated: "" });
const states = {};
const entities = {};
const add = (s, area, extra = {}) => { states[s.entity_id] = s; entities[s.entity_id] = { entity_id: s.entity_id, area_id: area, ...extra }; };
add(st("light.wohnzimmer_decke", "on"), "wohnzimmer");
add(st("light.wohnzimmer_stehlampe", "off"), "wohnzimmer");
add(st("cover.wohnzimmer_rollladen", "open", { current_position: 40, device_class: "shutter" }), "wohnzimmer");
add(st("binary_sensor.wohnzimmer_fenster", "on", { device_class: "window" }), "wohnzimmer");
add(st("sensor.wohnzimmer_temperatur", "21.4", { device_class: "temperature", unit_of_measurement: "°C" }), "wohnzimmer");
add(st("sensor.wohnzimmer_feuchte", "48", { device_class: "humidity", unit_of_measurement: "%" }), "wohnzimmer");
add(st("light.kueche", "off"), "kuche");
add(st("switch.kaffeemaschine", "on"), "kuche");
add(st("sensor.kueche_temperatur", "23.9", { device_class: "temperature" }), "kuche");
add(st("sensor.kueche_temperatur_2", "24.3", { device_class: "temperature" }), "kuche");
add(st("climate.bad", "heat"), "badezimmer");
add(st("sensor.bad_temperatur", "24.8", { device_class: "temperature" }), "badezimmer");
add(st("sensor.schlafzimmer_temperatur", "18.6", { device_class: "temperature" }), "schlafzimmer");
add(st("fan.schlafzimmer", "off"), "schlafzimmer");
add(st("binary_sensor.haustuer", "off", { device_class: "door" }), "flur");
add(st("cover.garagentor", "open", { device_class: "garage", current_position: 100 }), "garage");
add(st("light.bar", "on"), "bar");
add(st("light.versteckt", "on"), "bar", { hidden: true });
add(st("switch.diagnose", "on"), "bar", { entity_category: "diagnostic" });
add(st("binary_sensor.terrasse_doppel", "on", { device_class: "door" }), "wohnzimmer_x");
add(st("binary_sensor.schiebetuer", "on", { device_class: "door" }), "schlafzimmer_x");
add(st("sensor.waschraum_temperatur", "19.5", { device_class: "temperature" }), "waschraum");
const energy = {
  "sensor.system_anker_solix_sb_solarleistung": st("sensor.system_anker_solix_sb_solarleistung", "412", { unit_of_measurement: "W" }),
  "sensor.aktuell_pv_einspeisung": st("sensor.aktuell_pv_einspeisung", "380", { unit_of_measurement: "W" }),
  "sensor.system_anker_solix_sb_ladestand": st("sensor.system_anker_solix_sb_ladestand", "76", { unit_of_measurement: "%" }),
  "sensor.system_anker_solix_sb_akkuleistung": st("sensor.system_anker_solix_sb_akkuleistung", "-32", { unit_of_measurement: "W" }),
  "sensor.balkonkraftwerk_shelly_anker_balkonkraftwerk_balkonkraftwerk_ertrag_tag": st("sensor.balkonkraftwerk_shelly_anker_balkonkraftwerk_balkonkraftwerk_ertrag_tag", "1.234", { unit_of_measurement: "kWh" }),
};
for (const s of Object.values(energy)) add(s, "balkonkraftwerk");
window.calls = [];
window.events = [];
const hass = {
  states, entities, devices: {},
  themes: { darkMode: dark },
  user: { is_admin: true },
  callWS: async (msg) => { window.calls.push(msg); if (msg.type === "haus3d/building/get") return { building: data, revision: 1 }; return {}; },
  callService: async (domain, service, d) => { window.calls.push({ domain, service, ...d }); },
};
window.hass = hass;
document.addEventListener("hass-more-info", (e) => window.events.push(e.detail.entityId));
await import("../../custom_components/haus3d/frontend/haus3d-panel.js");
const panel = document.createElement("haus3d-panel");
panel.hass = hass;
panel.narrow = params.has("narrow");
document.body.appendChild(panel);
window.panel = panel;
</script>
</body>
</html>
